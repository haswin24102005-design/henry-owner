<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MMU Secrets</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Playfair+Display:wght@700&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0d0d0d;
      color: #e8e8e8;
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ── PAGE GRID ── */
    .page {
      display: grid;
      grid-template-columns: 1fr 400px 1fr;
      grid-template-rows: auto auto auto;
      min-height: 100vh;
      gap: 0;
    }

    /* ── HEADER spans full width ── */
    .header {
      grid-column: 1 / 4;
      text-align: center;
      padding: 44px 20px 20px;
    }
    .header h1 {
      font-family: 'Playfair Display', serif;
      font-size: 2rem;
      color: #fff;
    }
    .header h1 span { color: #a78bfa; }
    .header p { margin-top: 6px; color: #444; font-size: 0.82rem; }

    /* ── CENTER POST BOX ── */
    .center-box {
      grid-column: 2;
      grid-row: 2;
      padding: 10px 16px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .post-label {
      font-size: 0.72rem;
      color: #555;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    textarea {
      width: 100%;
      height: 110px;
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 12px;
      padding: 14px;
      color: #e8e8e8;
      font-family: 'Inter', sans-serif;
      font-size: 0.9rem;
      resize: none;
      outline: none;
      transition: border-color 0.2s;
    }
    textarea:focus { border-color: #7c3aed; }
    textarea::placeholder { color: #383838; }

    button.post {
      width: 100%;
      margin-top: 8px;
      padding: 11px;
      background: #7c3aed;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 0.88rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.18s;
    }
    button.post:hover { background: #6d28d9; }
    button.post:disabled { background: #3b2070; cursor: not-allowed; }

    /* ── SIDE COLUMNS (left & right) ── */
    .col-left {
      grid-column: 1;
      grid-row: 2 / 4;
      padding: 10px 12px 40px 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      border-right: 1px solid #1a1a1a;
    }
    .col-right {
      grid-column: 3;
      grid-row: 2 / 4;
      padding: 10px 20px 40px 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      border-left: 1px solid #1a1a1a;
    }

    /* ── BOTTOM CENTER (below post box) ── */
    .col-bottom {
      grid-column: 2;
      grid-row: 3;
      padding: 0 16px 40px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* ── CARD ── */
    .card {
      background: #141414;
      border: 1px solid #1e1e1e;
      border-radius: 11px;
      padding: 14px 16px;
      transition: border-color 0.2s;
      position: relative;
    }
    .card:hover { border-color: #2a2a2a; }
    .card p {
      font-size: 0.85rem;
      line-height: 1.65;
      color: #ccc;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .card .meta {
      margin-top: 10px;
      font-size: 0.68rem;
      color: #303030;
    }

    /* slightly bigger cards in center bottom */
    .col-bottom .card p { font-size: 0.9rem; }

    /* ── LOADING / EMPTY ── */
    .loading-grid {
      grid-column: 1 / 4;
      text-align: center;
      padding: 60px 20px;
      color: #333;
      font-size: 0.85rem;
    }

    /* ── TOAST ── */
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(60px);
      background: #1e1e1e;
      border: 1px solid #2a2a2a;
      color: #a78bfa;
      padding: 10px 22px;
      border-radius: 8px;
      font-size: 0.85rem;
      transition: transform 0.3s;
      white-space: nowrap;
      z-index: 99;
    }
    .toast.show { transform: translateX(-50%) translateY(0); }

    /* ── ADMIN DELETE ── */
    .del { display: none; }
    body.admin .del {
      display: block;
      position: absolute;
      top: 8px; right: 10px;
      background: none;
      border: none;
      color: #ef4444;
      font-size: 0.7rem;
      cursor: pointer;
      opacity: 0.5;
    }
    body.admin .del:hover { opacity: 1; }

    /* ── FOOTER ── */
    footer {
      grid-column: 1 / 4;
      text-align: center;
      padding: 24px 20px;
      color: #1e1e1e;
      font-size: 0.72rem;
      border-top: 1px solid #141414;
      user-select: none;
      cursor: default;
    }

    /* ── MOBILE: stack everything ── */
    @media (max-width: 860px) {
      .page {
        display: flex;
        flex-direction: column;
      }
      .col-left, .col-right, .col-bottom {
        border: none;
        padding: 0 16px;
      }
      .center-box { padding: 10px 16px 20px; }
      .header { padding: 36px 16px 16px; }
      footer { grid-column: unset; }
    }
  </style>
</head>
<body>

<div class="toast" id="toast"></div>

<div class="page" id="page">

  <!-- HEADER -->
  <div class="header">
    <h1>MMU <span>Secrets</span></h1>
    <p>Anonymous. No login. No judgment.</p>
  </div>

  <!-- CENTER: post box -->
  <div class="center-box">
    <div class="post-label">post your confession here</div>
    <textarea id="txt" placeholder="What's your secret…"></textarea>
    <button class="post" id="postBtn" onclick="postSecret()">Post Anonymously</button>
  </div>

  <!-- LEFT column — filled by JS -->
  <div class="col-left"  id="colLeft"></div>

  <!-- RIGHT column — filled by JS -->
  <div class="col-right" id="colRight"></div>

  <!-- BOTTOM center — filled by JS -->
  <div class="col-bottom" id="colBottom"></div>

  <!-- FOOTER -->
  <footer id="footer">MMU Secrets · anonymous forever</footer>

</div>

<script type="module">
  import { initializeApp }  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getFirestore, collection, addDoc,
           onSnapshot, query, orderBy,
           deleteDoc, doc, serverTimestamp }
    from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey:            "AIzaSyDlegLoSoqjwxm7UBg9u2LG93NYW1GqEog",
    authDomain:        "haswinmmuhenry.firebaseapp.com",
    projectId:         "haswinmmuhenry",
    storageBucket:     "haswinmmuhenry.firebasestorage.app",
    messagingSenderId: "719747850913",
    appId:             "1:719747850913:web:e8ed8f0ada88095b1786e0"
  };

  const ADMIN_PASS = "mmusecrets2024";

  const app = initializeApp(firebaseConfig);
  const db  = getFirestore(app);

  // ── Live feed ─────────────────────────────────────────────────
  const q = query(collection(db, "secrets"), orderBy("ts", "desc"));

  onSnapshot(q, snap => {
    const left   = document.getElementById("colLeft");
    const right  = document.getElementById("colRight");
    const bottom = document.getElementById("colBottom");

    left.innerHTML = right.innerHTML = bottom.innerHTML = "";

    if (snap.empty) {
      bottom.innerHTML = "<div style='text-align:center;color:#333;font-size:0.85rem;padding:40px 0'>No secrets yet. Be the first.</div>";
      return;
    }

    const docs = snap.docs;

    docs.forEach((d, i) => {
      const p  = d.data();
      const ms = p.ts?.toMillis?.() ?? Date.now();
      const card = `<div class="card">
        <button class="del" onclick="window._del('${d.id}')">✕</button>
        <p>${esc(p.text)}</p>
        <div class="meta">${timeAgo(ms)}</div>
      </div>`;

      // Distribute: left, right, bottom cycling
      const slot = i % 3;
      if (slot === 0) left.innerHTML  += card;
      if (slot === 1) right.innerHTML += card;
      if (slot === 2) bottom.innerHTML += card;
    });
  }, err => {
    console.error(err);
    document.getElementById("colBottom").innerHTML =
      `<div style='color:#ef4444;text-align:center;padding:20px;font-size:0.85rem'>Error: ${err.code}<br><small>${err.message}</small></div>`;
  });

  // ── Post ──────────────────────────────────────────────────────
  window.postSecret = async function () {
    const txt = document.getElementById("txt").value.trim();
    if (!txt) return;
    const btn = document.getElementById("postBtn");
    btn.disabled = true; btn.textContent = "Posting…";
    try {
      await addDoc(collection(db, "secrets"), { text: txt, ts: serverTimestamp() });
      document.getElementById("txt").value = "";
      showToast("Posted ✓");
    } catch (e) {
      console.error(e);
      showToast("Error: " + e.code);
    }
    btn.disabled = false; btn.textContent = "Post Anonymously";
  };

  // ── Delete ────────────────────────────────────────────────────
  window._del = async function (id) {
    if (!document.body.classList.contains("admin")) return;
    try { await deleteDoc(doc(db, "secrets", id)); }
    catch (e) { showToast("Delete failed: " + e.code); }
  };

  // ── Admin: tap footer 5× quickly ─────────────────────────────
  let taps = 0, tapTimer;
  document.getElementById("footer").addEventListener("click", () => {
    taps++; clearTimeout(tapTimer);
    tapTimer = setTimeout(() => taps = 0, 800);
    if (taps >= 5) {
      taps = 0;
      const p = prompt("Admin password:");
      if (p === ADMIN_PASS) { document.body.classList.add("admin"); showToast("Admin mode on 🔐"); }
    }
  });

  // ── Ctrl/Cmd+Enter ────────────────────────────────────────────
  document.getElementById("txt").addEventListener("keydown", e => {
    if ((e.ctrlKey || e.metaKey) && e.key === "Enter") window.postSecret();
  });

  // ── Helpers ───────────────────────────────────────────────────
  function esc(s) {
    return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  }
  function timeAgo(ts) {
    const d = Date.now() - ts;
    if (d < 60000)    return "just now";
    if (d < 3600000)  return Math.floor(d/60000) + "m ago";
    if (d < 86400000) return Math.floor(d/3600000) + "h ago";
    return new Date(ts).toLocaleDateString("en-MY",{day:"numeric",month:"short",year:"numeric"});
  }
  let toastT;
  function showToast(msg) {
    const t = document.getElementById("toast");
    t.textContent = msg; t.classList.add("show");
    clearTimeout(toastT);
    toastT = setTimeout(() => t.classList.remove("show"), 2500);
  }
</script>
</body>
</html>
