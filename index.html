<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MMU Secrets</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Playfair+Display:wght@700&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0d0d0d;
      color: #e8e8e8;
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
    }

    /* Header */
    header {
      text-align: center;
      padding: 60px 20px 40px;
    }
    header h1 {
      font-family: 'Playfair Display', serif;
      font-size: 2.2rem;
      color: #fff;
      letter-spacing: -0.5px;
    }
    header h1 span { color: #a78bfa; }
    header p {
      margin-top: 8px;
      color: #555;
      font-size: 0.88rem;
    }

    /* Post box */
    .box {
      max-width: 560px;
      margin: 0 auto;
      padding: 0 20px 50px;
    }

    textarea {
      width: 100%;
      height: 130px;
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 12px;
      padding: 16px;
      color: #e8e8e8;
      font-family: 'Inter', sans-serif;
      font-size: 0.95rem;
      resize: none;
      outline: none;
      transition: border-color 0.2s;
    }
    textarea:focus { border-color: #7c3aed; }
    textarea::placeholder { color: #404040; }

    button.post {
      width: 100%;
      margin-top: 10px;
      padding: 12px;
      background: #7c3aed;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 0.92rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.18s;
    }
    button.post:hover { background: #6d28d9; }
    button.post:disabled { background: #3b2070; cursor: not-allowed; }

    /* Divider */
    .divider {
      max-width: 560px;
      margin: 0 auto 28px;
      padding: 0 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      color: #333;
      font-size: 0.78rem;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: #1f1f1f;
    }

    /* Feed */
    .feed {
      max-width: 560px;
      margin: 0 auto;
      padding: 0 20px 60px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .card {
      background: #161616;
      border: 1px solid #222;
      border-radius: 12px;
      padding: 18px 20px;
    }
    .card p {
      font-size: 0.93rem;
      line-height: 1.7;
      color: #d4d4d4;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .card .meta {
      margin-top: 12px;
      font-size: 0.73rem;
      color: #3a3a3a;
    }

    .empty {
      text-align: center;
      color: #333;
      font-size: 0.88rem;
      padding: 40px 0;
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(60px);
      background: #1e1e1e;
      border: 1px solid #2a2a2a;
      color: #a78bfa;
      padding: 10px 22px;
      border-radius: 8px;
      font-size: 0.85rem;
      transition: transform 0.3s;
      white-space: nowrap;
    }
    .toast.show { transform: translateX(-50%) translateY(0); }

    /* Admin delete (hidden until admin mode) */
    .del { display: none; }
    body.admin .del {
      display: inline;
      float: right;
      background: none;
      border: none;
      color: #ef4444;
      font-size: 0.75rem;
      cursor: pointer;
      opacity: 0.6;
    }
    body.admin .del:hover { opacity: 1; }

    /* Secret admin trigger */
    footer {
      text-align: center;
      padding: 20px;
      color: #222;
      font-size: 0.75rem;
      cursor: default;
      user-select: none;
    }
  </style>
</head>
<body>

<div class="toast" id="toast"></div>

<header>
  <h1>MMU <span>Secrets</span></h1>
  <p>Anonymous. No login. No judgment.</p>
</header>

<div class="box">
  <textarea id="txt" placeholder="Share your secret…"></textarea>
  <button class="post" id="postBtn" onclick="post()">Post Anonymously</button>
</div>

<div class="divider">confessions</div>

<div class="feed" id="feed">
  <div class="empty" id="emptyMsg">No secrets yet. Be the first.</div>
</div>

<footer id="footer">MMU Secrets · anonymous forever</footer>

<script>
const ADMIN_PASS = "mmusecrets2024"; // ← change this
let data = [];
let adminMode = false;
let footerTaps = 0, footerTimer;

// ── Load ──────────────────────────────────────
async function load() {
  try {
    const r = await window.storage.get("posts");
    data = r ? JSON.parse(r.value) : [];
  } catch { data = []; }
  render();
}

// ── Save ──────────────────────────────────────
async function save() {
  await window.storage.set("posts", JSON.stringify(data));
}

// ── Post ──────────────────────────────────────
async function post() {
  const txt = document.getElementById("txt").value.trim();
  if (!txt) return;
  const btn = document.getElementById("postBtn");
  btn.disabled = true;
  btn.textContent = "Posting…";

  data.unshift({ id: Date.now().toString(36), text: txt, ts: Date.now() });
  await save();

  document.getElementById("txt").value = "";
  btn.disabled = false;
  btn.textContent = "Post Anonymously";
  toast("Posted ✓");
  render();
}

// ── Render ────────────────────────────────────
function render() {
  const feed = document.getElementById("feed");
  document.getElementById("emptyMsg").style.display = data.length ? "none" : "block";
  const cards = data.map(p => `
    <div class="card" id="c-${p.id}">
      <button class="del" onclick="del('${p.id}')">✕ delete</button>
      <p>${esc(p.text)}</p>
      <div class="meta">${timeAgo(p.ts)}</div>
    </div>`).join("");
  feed.innerHTML = (data.length ? "" : "<div class='empty' id='emptyMsg'>No secrets yet. Be the first.</div>") + cards;
}

// ── Delete (admin only) ───────────────────────
async function del(id) {
  if (!adminMode) return;
  data = data.filter(p => p.id !== id);
  await save();
  render();
}

// ── Admin: click footer 5× quickly ───────────
document.getElementById("footer").addEventListener("click", () => {
  footerTaps++;
  clearTimeout(footerTimer);
  footerTimer = setTimeout(() => footerTaps = 0, 800);
  if (footerTaps >= 5) {
    footerTaps = 0;
    const pass = prompt("Admin password:");
    if (pass === ADMIN_PASS) {
      adminMode = true;
      document.body.classList.add("admin");
      toast("Admin mode on");
      render();
    }
  }
});

// ── Helpers ───────────────────────────────────
function esc(s) {
  return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}
function timeAgo(ts) {
  const d = Date.now() - ts;
  if (d < 60000)    return "just now";
  if (d < 3600000)  return Math.floor(d/60000) + "m ago";
  if (d < 86400000) return Math.floor(d/3600000) + "h ago";
  return new Date(ts).toLocaleDateString("en-MY",{day:"numeric",month:"short",year:"numeric"});
}
let toastT;
function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastT);
  toastT = setTimeout(() => t.classList.remove("show"), 2500);
}

// ── Submit on Ctrl/Cmd+Enter ──────────────────
document.getElementById("txt").addEventListener("keydown", e => {
  if ((e.ctrlKey || e.metaKey) && e.key === "Enter") post();
});

load();
</script>
</body>
</html>
