<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MMU Secrets</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Playfair+Display:wght@700&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0d0d0d;
      color: #e8e8e8;
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ── PAGE GRID ── */
    .page {
      display: grid;
      grid-template-columns: 1fr 400px 1fr;
      grid-template-rows: auto auto auto;
      min-height: 100vh;
      gap: 0;
    }

    /* ── HEADER spans full width ── */
    .header {
      grid-column: 1 / 4;
      text-align: center;
      padding: 44px 20px 20px;
    }
    .header h1 {
      font-family: 'Playfair Display', serif;
      font-size: 2rem;
      color: #fff;
    }
    .header h1 span { color: #a78bfa; }
    .header p { margin-top: 6px; color: #444; font-size: 0.82rem; }

    /* ── COUNTER ── */
    .counter {
      color: #555;
      font-size: 0.75rem;
      margin-top: 4px;
    }

    /* ── CENTER POST BOX ── */
    .center-box {
      grid-column: 2;
      grid-row: 2;
      padding: 10px 16px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .post-label {
      font-size: 0.72rem;
      color: #555;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    textarea {
      width: 100%;
      height: 110px;
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 12px;
      padding: 14px;
      color: #e8e8e8;
      font-family: 'Inter', sans-serif;
      font-size: 0.9rem;
      resize: none;
      outline: none;
      transition: border-color 0.2s;
    }
    textarea:focus { border-color: #7c3aed; }
    textarea::placeholder { color: #383838; }

    button.post {
      width: 100%;
      margin-top: 8px;
      padding: 11px;
      background: #7c3aed;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 0.88rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.18s;
    }
    button.post:hover { background: #6d28d9; }
    button.post:disabled { background: #3b2070; cursor: not-allowed; }

    /* ── SIDE COLUMNS (left & right) ── */
    .col-left {
      grid-column: 1;
      grid-row: 2 / 4;
      padding: 10px 12px 40px 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      border-right: 1px solid #1a1a1a;
    }
    .col-right {
      grid-column: 3;
      grid-row: 2 / 4;
      padding: 10px 20px 40px 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      border-left: 1px solid #1a1a1a;
    }

    /* ── BOTTOM CENTER (below post box) ── */
    .col-bottom {
      grid-column: 2;
      grid-row: 3;
      padding: 0 16px 40px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* ── CARD ── */
    .card {
      background: #141414;
      border: 1px solid #1e1e1e;
      border-radius: 11px;
      padding: 14px 16px;
      transition: border-color 0.2s;
      position: relative;
    }
    .card:hover { border-color: #2a2a2a; }
    .card p.secret-text {
      font-size: 0.85rem;
      line-height: 1.65;
      color: #ccc;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .card .meta {
      margin-top: 10px;
      font-size: 0.68rem;
      color: #303030;
    }
    
    .own-post {
      border-color: #2e1a4a;
    }

    /* Actions & Replies UI */
    .card-actions {
      display: flex;
      gap: 12px;
      margin-top: 12px;
      border-top: 1px solid #1a1a1a;
      padding-top: 10px;
    }
    .card-actions button {
      background: none;
      border: none;
      color: #666;
      font-size: 0.75rem;
      cursor: pointer;
      transition: color 0.15s;
    }
    .card-actions button:hover { color: #a78bfa; }
    .card-actions button.liked { color: #7c3aed; font-weight: 500; }

    .replies-section {
      margin-top: 12px;
      padding-top: 8px;
    }
    .reply-input-wrap {
      display: none;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 10px;
    }
    .reply-input-wrap.open { display: flex; }
    .reply-input-wrap textarea {
      height: 50px;
      font-size: 0.8rem;
      padding: 8px;
    }
    .btn-send-reply {
      align-self: flex-end;
      padding: 4px 12px;
      background: #2a2a2a;
      color: #ccc;
      border: none;
      border-radius: 6px;
      font-size: 0.75rem;
      cursor: pointer;
    }
    .btn-send-reply:hover { background: #3a3a3a; }

    .replies-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 6px;
    }
    .reply-item {
      background: #181818;
      border-radius: 6px;
      padding: 8px 10px;
      font-size: 0.8rem;
      color: #bbb;
    }
    .reply-meta {
      font-size: 0.62rem;
      color: #444;
      margin-top: 4px;
    }

    /* slightly bigger cards in center bottom */
    .col-bottom .card p.secret-text { font-size: 0.9rem; }

    /* ── SKELETON LOADING ── */
    .skeleton {
      background: #141414;
      border: 1px solid #1e1e1e;
      border-radius: 11px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .skel-line {
      background: linear-gradient(90deg, #1a1a1a 25%, #242424 50%, #1a1a1a 75%);
      background-size: 200% 100%;
      animation: loading-skel 1.5s infinite;
      height: 10px;
      border-radius: 4px;
    }
    .skel-line.long { width: 90%; }
    .skel-line.med { width: 70%; }
    .skel-line.short { width: 50%; }
    .skel-line.xshort { width: 30%; height: 8px; margin-top: 6px;}

    @keyframes loading-skel {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    /* ── TOAST ── */
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(60px);
      background: #1e1e1e;
      border: 1px solid #2a2a2a;
      color: #a78bfa;
      padding: 10px 22px;
      border-radius: 8px;
      font-size: 0.85rem;
      transition: transform 0.3s;
      white-space: nowrap;
      z-index: 99;
    }
    .toast.show { transform: translateX(-50%) translateY(0); }

    /* ── ADMIN DELETE ── */
    .del { display: none; }
    body.admin .del {
      display: block;
      position: absolute;
      top: 8px; right: 10px;
      background: none;
      border: none;
      color: #ef4444;
      font-size: 0.7rem;
      cursor: pointer;
      opacity: 0.5;
    }
    body.admin .del:hover { opacity: 1; }

    /* ── FOOTER ── */
    footer {
      grid-column: 1 / 4;
      text-align: center;
      padding: 24px 20px;
      color: #1e1e1e;
      font-size: 0.72rem;
      border-top: 1px solid #141414;
      user-select: none;
      cursor: default;
    }

    /* ── MOBILE: stack everything ── */
    @media (max-width: 860px) {
      .page {
        display: flex;
        flex-direction: column;
      }
      .col-left, .col-right, .col-bottom {
        border: none;
        padding: 0 16px;
      }
      .center-box { padding: 10px 16px 20px; }
      .header { padding: 36px 16px 16px; }
      footer { grid-column: unset; }
    }
  </style>
</head>
<body>

<div class="toast" id="toast"></div>

<div class="page" id="page">

  <div class="header">
    <h1>MMU <span>Secrets</span></h1>
    <p>Anonymous. No login. No judgment.</p>
    <div class="counter"><span id="countVal">0</span> secrets revealed</div>
  </div>

  <div class="center-box">
    <div class="post-label">post your confession here</div>
    <textarea id="txt" placeholder="What's your secret…"></textarea>
    <button class="post" id="postBtn">Post Anonymously</button>
  </div>

  <div class="col-left"  id="colLeft"></div>

  <div class="col-right" id="colRight"></div>

  <div class="col-bottom" id="colBottom"></div>

  <footer id="footer">MMU Secrets · anonymous forever</footer>

</div>

<script type="module">
  import { initializeApp }  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, doc, serverTimestamp, updateDoc, increment } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
  import { getFunctions, httpsCallable } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-functions.js";

  // Obscured project mappings 
  const _m1 = "haswin";
  const _m2 = "mmu";
  const _m3 = "henry";
  const targetId = `${_m1}${_m2}${_m3}`;

  const firebaseConfig = {
    apiKey:            "AIzaSyDlegLoSoqjwxm7UBg9u2LG93NYW1GqEog",
    authDomain:        `${targetId}.firebaseapp.com`,
    projectId:         targetId,
    storageBucket:     `${targetId}.firebasestorage.app`,
    messagingSenderId: "719747850913",
    appId:             "1:719747850913:web:e8ed8f0ada88095b1786e0"
  };

  const app = initializeApp(firebaseConfig);
  const db  = getFirestore(app);
  const functions = getFunctions(app);

  const getLiked    = () => JSON.parse(localStorage.getItem("mmu_liked") || "[]");
  const setLiked    = arr => localStorage.setItem("mmu_liked", JSON.stringify(arr));

  const getOwnPosts = () => JSON.parse(sessionStorage.getItem("mmu_own") || "[]");
  const addOwnPost  = id => sessionStorage.setItem("mmu_own", JSON.stringify([...getOwnPosts(), id]));

  function showSkeletons() {
    const skelly = () => `
      <div class="skeleton">
        <div class="skel-line long"></div>
        <div class="skel-line med"></div>
        <div class="skel-line short"></div>
        <div class="skel-line xshort"></div>
      </div>`;
    document.getElementById("colLeft").innerHTML   = skelly() + skelly();
    document.getElementById("colRight").innerHTML  = skelly() + skelly();
    document.getElementById("colBottom").innerHTML = skelly();
  }
  showSkeletons();

  // Live snapshot context
  const q = query(collection(db, "secrets"), orderBy("ts", "desc"));

  onSnapshot(q, snap => {
    document.getElementById("countVal").textContent = snap.size;

    const left   = document.getElementById("colLeft");
    const right  = document.getElementById("colRight");
    const bottom = document.getElementById("colBottom");

    left.innerHTML = right.innerHTML = bottom.innerHTML = "";

    if (snap.empty) {
      bottom.innerHTML = "<div style='text-align:center;color:#333;font-size:0.85rem;padding:40px 0'>No secrets yet. Be the first.</div>";
      return;
    }

    const ownPosts = getOwnPosts();

    snap.docs.forEach((d, i) => {
      const p     = d.data();
      const ms    = p.ts?.toMillis?.() ?? Date.now();
      const liked = getLiked().includes(d.id);
      const likes = p.likes || 0;
      const isOwn = ownPosts.includes(d.id);

      const card = document.createElement("div");
      card.className = "card" + (isOwn ? " own-post" : "");
      card.id = "card-" + d.id;
      card.innerHTML = `
        <button class="del">✕</button>
        <p class="secret-text">${esc(p.text)}</p>
        <div class="meta">${timeAgo(ms)}</div>
        <div class="card-actions">
          <button class="btn-like${liked ? ' liked' : ''}" id="like-${d.id}">
            Like (${likes})
          </button>
          <button class="btn-reply">Reply</button>
        </div>
        <div class="replies-section" id="replies-${d.id}">
          <div class="reply-input-wrap" id="reply-input-${d.id}">
            <textarea placeholder="Reply anonymously… (write #takedown to report)" id="reply-txt-${d.id}"></textarea>
            <button class="btn-send-reply" id="reply-btn-${d.id}">Send</button>
          </div>
          <div class="replies-list" id="replies-list-${d.id}"></div>
        </div>
      `;

      card.querySelector('.del').addEventListener('click', () => delSecret(d.id));
      card.querySelector('.btn-like').addEventListener('click', () => likeSecret(d.id));
      card.querySelector('.btn-reply').addEventListener('click', () => toggleReply(d.id));
      card.querySelector('.btn-send-reply').addEventListener('click', () => sendReply(d.id));

      const slot = i % 3;
      if (slot === 0) left.appendChild(card);
      if (slot === 1) right.appendChild(card);
      if (slot === 2) bottom.appendChild(card);

      loadReplies(d.id);
    });

  }, err => {
    document.getElementById("colBottom").innerHTML =
      `<div style='color:#ef4444;text-align:center;padding:20px;font-size:0.85rem'>Error: ${err.code}<br><small>${err.message}</small></div>`;
  });

  function loadReplies(postId) {
    const rq = query(collection(db, "secrets", postId, "replies"), orderBy("ts", "asc"));
    onSnapshot(rq, snap => {
      const list = document.getElementById("replies-list-" + postId);
      if (!list) return;
      list.innerHTML = "";
      snap.docs.forEach(rd => {
        const r  = rd.data();
        const ms = r.ts?.toMillis?.() ?? Date.now();
        const item = document.createElement("div");
        item.className = "reply-item";
        item.innerHTML = `${esc(r.text)}<div class="reply-meta">${timeAgo(ms)}</div>`;
        list.appendChild(item);
      });
    });
  }

  async function postSecret() {
    const txt = document.getElementById("txt").value.trim();
    if (!txt) return;
    const btn = document.getElementById("postBtn");
    btn.disabled = true; btn.textContent = "Posting…";
    try {
      const ref = await addDoc(collection(db, "secrets"), {
        text: txt, ts: serverTimestamp(), likes: 0
      });
      addOwnPost(ref.id);
      document.getElementById("txt").value = "";
      showToast("Posted ✓");
    } catch (e) {
      showToast("Error: " + e.code);
    }
    btn.disabled = false; btn.textContent = "Post Anonymously";
  }
  document.getElementById("postBtn").addEventListener("click", postSecret);

  function toggleReply(postId) {
    const wrap = document.getElementById("reply-input-" + postId);
    if (!wrap) return;
    wrap.classList.toggle("open");
    if (wrap.classList.contains("open")) document.getElementById("reply-txt-" + postId)?.focus();
  }

  async function sendReply(postId) {
    const txtEl = document.getElementById("reply-txt-" + postId);
    const btn   = document.getElementById("reply-btn-" + postId);
    if (!txtEl) return;
    const txt = txtEl.value.trim();
    if (!txt) return;
    btn.disabled = true; btn.textContent = "Sending…";
    try {
      await addDoc(collection(db, "secrets", postId, "replies"), {
        text: txt, ts: serverTimestamp()
      });
      txtEl.value = "";
      document.getElementById("reply-input-" + postId)?.classList.remove("open");
      showToast(txt.toLowerCase().includes("#takedown") ? "Report submitted. Admin will review." : "Reply posted ✓");
    } catch (e) {
      showToast("Error: " + e.code);
    }
    btn.disabled = false; btn.textContent = "Send";
  }

  async function likeSecret(postId) {
    const liked = getLiked();
    if (liked.includes(postId)) return;
    try {
      await updateDoc(doc(db, "secrets", postId), { likes: increment(1) });
      setLiked([...liked, postId]);
      const btn = document.getElementById("like-" + postId);
      if (btn) btn.classList.add("liked");
    } catch (e) {
      showToast("Error: " + e.code);
    }
  }

  // ── SECURE BOUNDARY: DELETION VIA CLOUD FUNCTION ──
  async function delSecret(id) {
    if (!document.body.classList.contains("admin")) return;
    
    const pInput = prompt("Enter verification key to proceed with deletion:");
    if (!pInput) return;

    try {
      showToast("Requesting deletion...");
      // Calls back-end verification. Key and execution are hidden entirely from client inspection.
      const secureDeleteCall = httpsCallable(functions, 'verifyAndExecuteDelete');
      const payload = await secureDeleteCall({ postId: id, accessKey: pInput });
      
      if (payload.data.success) {
        showToast("Post removed securely ✓");
      } else {
        showToast("Verification failed: " + payload.data.message);
      }
    } catch (e) { 
      showToast("Action rejected: " + e.message); 
    }
  }

  // Admin access node tracking
  let taps = 0, tapTimer;
  document.getElementById("footer").addEventListener("click", () => {
    taps++; clearTimeout(tapTimer);
    tapTimer = setTimeout(() => taps = 0, 800);
    if (taps >= 5) {
      taps = 0;
      document.body.classList.add("admin"); 
      showToast("Administrative views visible 🔐");
    }
  });

  document.getElementById("txt").addEventListener("keydown", e => {
    if ((e.ctrlKey || e.metaKey) && e.key === "Enter") postSecret();
  });

  function esc(s) {
    return String(s || "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  }
  
  function timeAgo(ts) {
    const d = Date.now() - ts;
    if (d < 60000)    return "just now";
    if (d < 3600000)  return Math.floor(d/60000) + "m ago";
    if (d < 86400000) return Math.floor(d/3600000) + "h ago";
    return new Date(ts).toLocaleDateString("en-MY",{day:"numeric",month:"short",year:"numeric"});
  }
  
  let toastT;
  function showToast(msg) {
    const t = document.getElementById("toast");
    t.textContent = msg; t.classList.add("show");
    clearTimeout(toastT);
    toastT = setTimeout(() => t.classList.remove("show"), 2800);
  }
</script>
</body>
</html>
