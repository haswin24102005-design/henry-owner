<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MMU Secrets</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Playfair+Display:wght@700&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0d0d0d;
      color: #e8e8e8;
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
    }

    header {
      text-align: center;
      padding: 60px 20px 40px;
    }
    header h1 {
      font-family: 'Playfair Display', serif;
      font-size: 2.2rem;
      color: #fff;
    }
    header h1 span { color: #a78bfa; }
    header p { margin-top: 8px; color: #555; font-size: 0.88rem; }

    .box {
      max-width: 560px;
      margin: 0 auto;
      padding: 0 20px 50px;
    }

    textarea {
      width: 100%;
      height: 130px;
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 12px;
      padding: 16px;
      color: #e8e8e8;
      font-family: 'Inter', sans-serif;
      font-size: 0.95rem;
      resize: none;
      outline: none;
      transition: border-color 0.2s;
    }
    textarea:focus { border-color: #7c3aed; }
    textarea::placeholder { color: #404040; }

    button.post {
      width: 100%;
      margin-top: 10px;
      padding: 12px;
      background: #7c3aed;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 0.92rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.18s;
    }
    button.post:hover { background: #6d28d9; }
    button.post:disabled { background: #3b2070; cursor: not-allowed; }

    .divider {
      max-width: 560px;
      margin: 0 auto 28px;
      padding: 0 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      color: #333;
      font-size: 0.78rem;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: #1f1f1f;
    }

    .feed {
      max-width: 560px;
      margin: 0 auto;
      padding: 0 20px 60px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .card {
      background: #161616;
      border: 1px solid #222;
      border-radius: 12px;
      padding: 18px 20px;
    }
    .card p {
      font-size: 0.93rem;
      line-height: 1.7;
      color: #d4d4d4;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .card .meta {
      margin-top: 12px;
      font-size: 0.73rem;
      color: #3a3a3a;
    }

    .empty {
      text-align: center;
      color: #333;
      font-size: 0.88rem;
      padding: 40px 0;
    }

    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(60px);
      background: #1e1e1e;
      border: 1px solid #2a2a2a;
      color: #a78bfa;
      padding: 10px 22px;
      border-radius: 8px;
      font-size: 0.85rem;
      transition: transform 0.3s;
      white-space: nowrap;
      z-index: 99;
    }
    .toast.show { transform: translateX(-50%) translateY(0); }

    .del { display: none; }
    body.admin .del {
      display: inline;
      float: right;
      background: none;
      border: none;
      color: #ef4444;
      font-size: 0.75rem;
      cursor: pointer;
      opacity: 0.6;
      margin-left: 8px;
    }
    body.admin .del:hover { opacity: 1; }

    footer {
      text-align: center;
      padding: 20px;
      color: #222;
      font-size: 0.75rem;
      user-select: none;
    }
  </style>
</head>
<body>

<div class="toast" id="toast"></div>

<header>
  <h1>MMU <span>Secrets</span></h1>
  <p>Anonymous. No login. No judgment.</p>
</header>

<div class="box">
  <textarea id="txt" placeholder="Share your secret…"></textarea>
  <button class="post" id="postBtn" onclick="postSecret()">Post Anonymously</button>
</div>

<div class="divider">confessions</div>

<div class="feed" id="feed">
  <div class="empty">Loading…</div>
</div>

<footer id="footer">MMU Secrets · anonymous forever</footer>

<script type="module">
  import { initializeApp }     from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getFirestore, collection, addDoc,
           onSnapshot, query, orderBy,
           deleteDoc, doc, serverTimestamp }
    from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey:            "AIzaSyDlegLoSoqjwxm7UBg9u2LG93NYW1GqEog",
    authDomain:        "haswinmmuhenry.firebaseapp.com",
    projectId:         "haswinmmuhenry",
    storageBucket:     "haswinmmuhenry.firebasestorage.app",
    messagingSenderId: "719747850913",
    appId:             "1:719747850913:web:e8ed8f0ada88095b1786e0"
  };

  const ADMIN_PASS = "mmusecrets2024"; // ← change this to your own password

  const app = initializeApp(firebaseConfig);
  const db  = getFirestore(app);

  // ── Live feed ─────────────────────────────────────────────────
  const q = query(collection(db, "secrets"), orderBy("ts", "desc"));

  onSnapshot(q, snap => {
    const feed = document.getElementById("feed");
    if (snap.empty) {
      feed.innerHTML = "<div class='empty'>No secrets yet. Be the first.</div>";
      return;
    }
    feed.innerHTML = snap.docs.map(d => {
      const p = d.data();
      const ms = p.ts?.toMillis?.() ?? Date.now();
      return `<div class="card">
        <button class="del" onclick="window._delete('${d.id}')">✕ delete</button>
        <p>${esc(p.text)}</p>
        <div class="meta">${timeAgo(ms)}</div>
      </div>`;
    }).join("");
  }, err => {
    console.error(err);
    document.getElementById("feed").innerHTML =
      "<div class='empty'>Could not load posts. Check Firestore rules.</div>";
  });

  // ── Post ──────────────────────────────────────────────────────
  window.postSecret = async function () {
    const txt = document.getElementById("txt").value.trim();
    if (!txt) return;
    const btn = document.getElementById("postBtn");
    btn.disabled = true;
    btn.textContent = "Posting…";
    try {
      await addDoc(collection(db, "secrets"), {
        text: txt,
        ts:   serverTimestamp()
      });
      document.getElementById("txt").value = "";
      showToast("Posted ✓");
    } catch (e) {
      console.error(e);
      showToast("Error: " + e.code);
      document.getElementById("feed").innerHTML =
        `<div class='empty' style='color:#ef4444'>Error: ${e.code}<br><small>${e.message}</small></div>`;
    }
    btn.disabled = false;
    btn.textContent = "Post Anonymously";
  };

  // ── Delete (admin only) ───────────────────────────────────────
  window._delete = async function (id) {
    if (!document.body.classList.contains("admin")) return;
    try { await deleteDoc(doc(db, "secrets", id)); }
    catch (e) { showToast("Delete failed"); console.error(e); }
  };

  // ── Admin: tap footer 5× quickly ─────────────────────────────
  let taps = 0, tapTimer;
  document.getElementById("footer").addEventListener("click", () => {
    taps++;
    clearTimeout(tapTimer);
    tapTimer = setTimeout(() => taps = 0, 800);
    if (taps >= 5) {
      taps = 0;
      const p = prompt("Admin password:");
      if (p === ADMIN_PASS) {
        document.body.classList.add("admin");
        showToast("Admin mode on 🔐");
      }
    }
  });

  // ── Ctrl/Cmd+Enter to post ────────────────────────────────────
  document.getElementById("txt").addEventListener("keydown", e => {
    if ((e.ctrlKey || e.metaKey) && e.key === "Enter") window.postSecret();
  });

  // ── Helpers ───────────────────────────────────────────────────
  function esc(s) {
    return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  }
  function timeAgo(ts) {
    const d = Date.now() - ts;
    if (d < 60000)    return "just now";
    if (d < 3600000)  return Math.floor(d / 60000) + "m ago";
    if (d < 86400000) return Math.floor(d / 3600000) + "h ago";
    return new Date(ts).toLocaleDateString("en-MY", {
      day: "numeric", month: "short", year: "numeric"
    });
  }
  let toastT;
  function showToast(msg) {
    const t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(toastT);
    toastT = setTimeout(() => t.classList.remove("show"), 2500);
  }
  window.showToast = showToast;
</script>
</body>
</html>
